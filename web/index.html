<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>具身智能知识库问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f8fa; color: #1f2330;
    display: flex; flex-direction: column; height: 100vh;
  }
  #chat { flex: 1; overflow-y: auto; padding: 24px; max-width: 820px; width: 100%; margin: 0 auto; }

  /* ---- 首屏 hero ---- */
  #hero { margin-top: 10vh; text-align: center; }
  #hero h1 { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
  #hero h1 .accent { color: #4d6bfe; }
  #hero .sub { margin-top: 10px; color: #8a8fa3; font-size: 14px; }
  #cards {
    display: flex; gap: 16px; justify-content: center; margin-top: 40px;
    flex-wrap: wrap;
  }
  .card {
    width: 215px; border-radius: 14px; padding: 18px 16px 22px; text-align: left;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(31,35,48,.08); }
  .card .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .card .card-desc { font-size: 12.5px; color: #6b7080; }
  .card .card-icon { position: absolute; right: 10px; bottom: 6px; font-size: 30px; opacity: .35; }
  .c1 { background: linear-gradient(135deg, #e9f0ff, #d8e5ff); }
  .c1 .card-title { color: #2b5cff; }
  .c2 { background: linear-gradient(135deg, #fff3e5, #ffe6c8); }
  .c2 .card-title { color: #f08a1e; }
  .c3 { background: linear-gradient(135deg, #f0ebff, #e3d9ff); }
  .c3 .card-title { color: #7c5cff; }

  /* ---- 消息 ---- */
  .msg { margin-bottom: 18px; line-height: 1.7; }
  .msg.user { text-align: right; }
  .msg.user .bubble { background: #4d6bfe; color: #fff; margin-left: auto; border: none; }
  .bubble {
    display: inline-block; max-width: 88%; padding: 13px 18px; text-align: left;
    border-radius: 14px; background: #fff; border: 1px solid #eceef5;
    box-shadow: 0 1px 4px rgba(31,35,48,.04);
    white-space: pre-wrap; word-break: break-word;
  }
  .steps { margin-bottom: 6px; max-width: 88%; }
  .step-line {
    font-size: 12.5px; color: #9298ab; padding: 2px 0 2px 18px;
    position: relative; line-height: 1.5;
  }
  .step-line::before { content: '◆'; position: absolute; left: 4px; color: #c3cbf2; font-size: 9px; }
  .sources { margin-top: 8px; max-width: 88%; }
  .source-item {
    background: #fff; border: 1px solid #eceef5; border-radius: 10px;
    margin-bottom: 6px; font-size: 13px; overflow: hidden;
  }
  .source-item summary { padding: 9px 14px; cursor: pointer; color: #4d6bfe; user-select: none; }
  .source-item .snippet {
    padding: 9px 14px; border-top: 1px dashed #eceef5;
    color: #555; white-space: pre-wrap; max-height: 200px; overflow-y: auto;
  }
  .ref {
    display: inline-block; background: #ecf0ff; color: #4d6bfe;
    border-radius: 4px; padding: 0 5px; font-size: 12px; margin: 0 1px;
  }
  .typing { color: #9298ab; font-size: 13px; }

  /* ---- 输入区 ---- */
  #input-area { padding: 8px 24px 14px; }
  #input-box {
    max-width: 820px; margin: 0 auto; background: #fff;
    border: 1.5px solid #4d6bfe; border-radius: 18px;
    padding: 14px 16px 12px; box-shadow: 0 4px 18px rgba(77,107,254,.07);
  }
  #question {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 15px; font-family: inherit; line-height: 1.6; min-height: 44px;
    background: transparent;
  }
  #input-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  #mode-toggle {
    display: flex; background: #f1f3f8; border-radius: 999px; padding: 3px;
  }
  #mode-toggle button {
    border: none; background: transparent; padding: 5px 16px; font-size: 13px;
    color: #6b7080; cursor: pointer; font-family: inherit; border-radius: 999px;
  }
  #mode-toggle button.active {
    background: #fff; color: #4d6bfe; font-weight: 600;
    box-shadow: 0 1px 4px rgba(31,35,48,.1);
  }
  #send {
    padding: 8px 26px; border: none; border-radius: 12px; background: #4d6bfe;
    color: #fff; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #send:disabled { background: #e7eaf3; color: #aab0c0; cursor: not-allowed; }
  #footer-note { text-align: center; color: #b3b8c7; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div id="chat">
  <div id="hero">
    <h1>具身智能行业研究 <span class="accent">Agent</span></h1>
    <div class="sub">120+ 份行业报告、券商深度与白皮书 · 回答标注报告来源，可溯源到页</div>
    <div id="cards">
      <div class="card c1" data-q="2025年中国具身智能市场规模预测是多少？">
        <div class="card-title">行业数据快查</div>
        <div class="card-desc">市场规模、增速、融资额，带来源可核对</div>
        <div class="card-icon">🔍</div>
      </div>
      <div class="card c2" data-q="对比不同报告对人形机器人量产时间表的预测差异">
        <div class="card-title">跨报告对比</div>
        <div class="card-desc">多份报告观点拆解检索，逐一标注出处</div>
        <div class="card-icon">⚖️</div>
      </div>
      <div class="card c3" data-q="2024年具身智能领域的融资事件和金额有多少？">
        <div class="card-title">图表数据问答</div>
        <div class="card-desc">280个图表页已解析，图里的数字也能问</div>
        <div class="card-icon">📈</div>
      </div>
    </div>
  </div>
</div>
<div id="input-area">
  <div id="input-box">
    <textarea id="question" rows="2" placeholder="输入你想了解的内容，回答会标注报告来源！"></textarea>
    <div id="input-controls">
      <div id="mode-toggle">
        <button id="mode-fast" class="active" title="deepseek-v4-flash，响应快">@ 快速</button>
        <button id="mode-thinking" title="deepseek-v4-pro，推理更深">✳ 思考</button>
      </div>
      <button id="send" disabled>发送</button>
    </div>
  </div>
  <div id="footer-note">所有内容均由 AI 生成，内容仅供参考，请仔细甄别</div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send');
const hero = document.getElementById('hero');

let mode = 'fast';
for (const m of ['fast', 'thinking']) {
  document.getElementById('mode-' + m).addEventListener('click', () => {
    mode = m;
    document.getElementById('mode-fast').classList.toggle('active', m === 'fast');
    document.getElementById('mode-thinking').classList.toggle('active', m === 'thinking');
  });
}

for (const card of document.querySelectorAll('.card')) {
  card.addEventListener('click', () => {
    input.value = card.dataset.q;
    input.focus();
    sendBtn.disabled = false;
  });
}

input.addEventListener('input', () => {
  if (!streaming) sendBtn.disabled = !input.value.trim();
});

function renderAnswer(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/^#{1,4}\s*(.+)$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[来源(\d+)\]/g, '<span class="ref">来源$1</span>');
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addBotMsg() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const steps = document.createElement('div');
  steps.className = 'steps';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing">分析问题中…</span>';
  div.appendChild(steps);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return { div, bubble, steps };
}

function addStep(steps, text) {
  const line = document.createElement('div');
  line.className = 'step-line';
  line.textContent = text;
  steps.appendChild(line);
  chat.scrollTop = chat.scrollHeight;
}

function renderSources(container, sources) {
  const wrap = document.createElement('div');
  wrap.className = 'sources';
  sources.forEach((s, i) => {
    const details = document.createElement('details');
    details.className = 'source-item';
    const summary = document.createElement('summary');
    summary.textContent = `来源${i + 1} 《${s.source}》 第${s.page}页` + (s.kind === 'chart' ? ' · 图表页' : '');
    const snippet = document.createElement('div');
    snippet.className = 'snippet';
    snippet.textContent = s.text;
    details.appendChild(summary);
    details.appendChild(snippet);
    wrap.appendChild(details);
  });
  container.appendChild(wrap);
}

let streaming = false;

async function ask() {
  const q = input.value.trim();
  if (!q || streaming) return;
  hero.style.display = 'none';
  input.value = '';
  streaming = true;
  sendBtn.disabled = true;
  addUserMsg(q);
  const { div, bubble, steps } = addBotMsg();
  let answerText = '';
  let sources = [];
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, mode }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const evt of events) {
        let eventType = 'message', data = '';
        for (const line of evt.split('\n')) {
          if (line.startsWith('event:')) eventType = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (eventType === 'sources') {
          sources = JSON.parse(data);
        } else if (eventType === 'step') {
          addStep(steps, JSON.parse(data));
        } else if (eventType === 'message' && data) {
          answerText += JSON.parse(data);
          bubble.innerHTML = renderAnswer(answerText);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
    if (sources.length) renderSources(div, sources);
  } catch (e) {
    bubble.textContent = '请求出错：' + e.message;
  }
  streaming = false;
  sendBtn.disabled = !input.value.trim();
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener('click', ask);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
</script>
</body>
</html>
