<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>具身智能知识库问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa; color: #1f2330;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 24px; background: #fff; border-bottom: 1px solid #e6e8f0;
    font-size: 17px; font-weight: 600;
  }
  header span { color: #5b6bf0; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 18px; line-height: 1.7; }
  .msg.user .bubble {
    background: #5b6bf0; color: #fff; margin-left: auto;
  }
  .bubble {
    display: inline-block; max-width: 85%; padding: 12px 16px;
    border-radius: 12px; background: #fff; border: 1px solid #e6e8f0;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { text-align: right; }
  .sources { margin-top: 8px; max-width: 85%; }
  .source-item {
    background: #fff; border: 1px solid #e6e8f0; border-radius: 8px;
    margin-bottom: 6px; font-size: 13px; overflow: hidden;
  }
  .source-item summary {
    padding: 8px 12px; cursor: pointer; color: #5b6bf0; user-select: none;
  }
  .source-item .snippet {
    padding: 8px 12px; border-top: 1px dashed #e6e8f0;
    color: #555; white-space: pre-wrap; max-height: 200px; overflow-y: auto;
  }
  #input-area {
    padding: 16px 24px 24px; background: #f5f6fa;
  }
  #input-row {
    max-width: 860px; margin: 0 auto; display: flex; gap: 10px;
  }
  #question {
    flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #d8dbe8;
    font-size: 15px; outline: none; resize: none; font-family: inherit;
  }
  #question:focus { border-color: #5b6bf0; }
  #send {
    padding: 0 24px; border: none; border-radius: 10px; background: #5b6bf0;
    color: #fff; font-size: 15px; cursor: pointer;
  }
  #send:disabled { background: #b8bee8; cursor: not-allowed; }
  .typing { color: #999; font-size: 13px; }
  .ref {
    display: inline-block; background: #eef0fe; color: #5b6bf0;
    border-radius: 4px; padding: 0 5px; font-size: 12px; margin: 0 1px;
  }
  .steps { margin-bottom: 6px; max-width: 85%; }
  .step-line {
    font-size: 12.5px; color: #8a8fa3; padding: 2px 0 2px 18px;
    position: relative; line-height: 1.5;
  }
  .step-line::before {
    content: '◆'; position: absolute; left: 4px; color: #b8bee8; font-size: 9px;
  }
</style>
</head>
<body>
<header>具身智能<span>知识库问答</span> · 120+ 行业研究报告</header>
<div id="chat">
  <div class="msg"><div class="bubble">你好！我是具身智能行业研究助手，知识库收录了120多份行业报告、券商深度和白皮书。可以问我市场规模、技术路线、产业链、公司动态等问题，回答会标注报告来源。</div></div>
</div>
<div id="input-area">
  <div id="input-row">
    <textarea id="question" rows="1" placeholder="例如：2025年具身智能市场规模预测是多少？"></textarea>
    <button id="send">发送</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const sendBtn = document.getElementById('send');

function renderAnswer(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc
    .replace(/^#{1,4}\s*(.+)$/gm, '<strong>$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[来源(\d+)\]/g, '<span class="ref">来源$1</span>');
}

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addBotMsg() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const steps = document.createElement('div');
  steps.className = 'steps';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing">分析问题中…</span>';
  div.appendChild(steps);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return { div, bubble, steps };
}

function addStep(steps, text) {
  const line = document.createElement('div');
  line.className = 'step-line';
  line.textContent = text;
  steps.appendChild(line);
  chat.scrollTop = chat.scrollHeight;
}

function renderSources(container, sources) {
  const wrap = document.createElement('div');
  wrap.className = 'sources';
  sources.forEach((s, i) => {
    const details = document.createElement('details');
    details.className = 'source-item';
    const summary = document.createElement('summary');
    summary.textContent = `来源${i + 1} 《${s.source}》 第${s.page}页`;
    const snippet = document.createElement('div');
    snippet.className = 'snippet';
    snippet.textContent = s.text;
    details.appendChild(summary);
    details.appendChild(snippet);
    wrap.appendChild(details);
  });
  container.appendChild(wrap);
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendBtn.disabled = true;
  addUserMsg(q);
  const { div, bubble, steps } = addBotMsg();
  let answerText = '';
  let sources = [];
  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const evt of events) {
        let eventType = 'message', data = '';
        for (const line of evt.split('\n')) {
          if (line.startsWith('event:')) eventType = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (eventType === 'sources') {
          sources = JSON.parse(data);
        } else if (eventType === 'step') {
          addStep(steps, JSON.parse(data));
        } else if (eventType === 'message' && data) {
          answerText += JSON.parse(data);
          bubble.innerHTML = renderAnswer(answerText);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
    if (sources.length) renderSources(div, sources);
  } catch (e) {
    bubble.textContent = '请求出错：' + e.message;
  }
  sendBtn.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener('click', ask);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
</script>
</body>
</html>
